<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic HTML Only Example</title>
</head>
<body>

    <h1>Welcome to My Plain Webpage</h1>
    <p>This page uses <strong>zero CSS styles</strong> and <strong>no JavaScript</strong>. It relies entirely on the browser's default settings.</p>

    <h2>My Favorite Fruits</h2>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ul>

    <h2>Useful Resources</h2>
    <p>You can learn more standard elements directly from the official <a href="https://mozilla.org">MDN Web Docs HTML Guide</a>.</p>

</body>
</html>
